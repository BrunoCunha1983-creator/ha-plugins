name: Pingo Doce — Sessão Persistente
version: "1.0.0"
slug: pingo_doce_session
description: Mantém a área pessoal do Pingo Doce aberta num Chromium persistente e publica os dados básicos no Home Assistant.
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
webui: "http://[HOST]:[PORT:7900]/vnc.html?autoconnect=true&resize=scale"
ports:
  7900/tcp: 7900
ports_description:
  7900/tcp: Janela Chromium para autenticação
options:
  refresh_interval: 300
  watchdog_interval: 30
  vnc_password: ""
  log_level: info
schema:
  refresh_interval: int
  watchdog_interval: int
  vnc_password: password
  log_level: list(debug|info|warning|error)
