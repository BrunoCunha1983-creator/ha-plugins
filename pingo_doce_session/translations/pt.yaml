configuration:
  refresh_interval:
    name: Intervalo de atualização
    description: Segundos entre verificações da sessão e atualização dos dados. Mínimo efetivo de 60 segundos.
  watchdog_interval:
    name: Intervalo do watchdog
    description: Segundos entre verificações de que o Chromium e a página continuam abertos. Mínimo efetivo de 10 segundos.
  vnc_password:
    name: Palavra-passe da janela Chromium
    description: Opcional. Se ficar vazia, a janela Web do add-on não pede palavra-passe adicional.
  log_level:
    name: Nível de registo
    description: Quantidade de informação apresentada nos registos do add-on.
network:
  7900/tcp: Janela Chromium para autenticação no Pingo Doce
