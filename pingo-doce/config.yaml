name: Pingo Doce Plus
version: "2.0.0"
slug: pingo_doce_session
description: Login persistente no Pingo Doce e integração automática com o Home Assistant.
arch:
  - amd64
startup: application
boot: auto
init: false
map:
  - config:rw
webui: "http://[HOST]:[PORT:7900]/vnc.html?autoconnect=true&resize=scale"
ports:
  7900/tcp: 7900
ports_description:
  7900/tcp: Janela Chromium para autenticação
options:
  refresh_interval: 300
  watchdog_interval: 30
  vnc_password: ""
  log_level: info
schema:
  refresh_interval: int
  watchdog_interval: int
  vnc_password: password
  log_level: list(debug|info|warning|error)
